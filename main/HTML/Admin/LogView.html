<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Audit Log View</title>
    <link rel="icon" type="image/png" href="../../../resource/icon/logo_remove_BG.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap">

    <!-- Material Symbols -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap">

    <!-- AAIR Tailwind Configuration -->
    <script src="../../JavaScript/tailwind.js"></script>

    <!-- Custom CSS -->
    <link href="../../Style/adminLogView.css" rel="stylesheet">

    <link href="../../Style/basic.css" rel="stylesheet">
    <link href="../../Style/navbar.css" rel="stylesheet">

    <link href="../../Style/jellykeyDesignSystem.css" rel="stylesheet">
</head>

<body class="bg-surface text-on-surface selection:bg-primary-container selection:text-on-primary-container">

    <!-- Unified Navbar Mount -->
    <div data-aair-navbar-mount></div>

    <!-- TopNavBar -->
    <header class="w-full h-12
           flex items-center px-6
           bg-text-active border-b border-outline-variant
           shadow-sm sticky top-[58px] z-30 mb-6">

        <!-- Search Box - Left -->
        <div class="relative w-[280px]">

            <span class="material-symbols-outlined
                     absolute left-3 top-1/2
                     -translate-y-1/2
                     text-slate-400 text-[20px]">
                search
            </span>

            <input type="text" placeholder="Search ..." class="w-full h-8
                   pl-10 pr-4
                   rounded-lg
                   border border-slate-300
                   bg-white
                   text-sm
                   outline-none
                   focus:border-blue-500
                   focus:ring-2
                   focus:ring-blue-100">
        </div>

        <!-- Buttons -->
        <div class="ml-auto flex items-center gap-2">

            <div class="flex items-center gap-2">
                <label class="text-label-md text-on-surface-variant">Resource:</label>
                <select
                    class="bg-surface border border-outline-variant rounded-lg px-3 py-1.5 text-body-sm font-medium focus:outline-none focus:ring-1 focus:ring-primary">
                    <option>All</option>
                    <option>Active</option>
                    <option>Disabled</option>
                </select>
            </div>

            <div class="flex items-center gap-2">
                <label class="text-label-md text-on-surface-variant">Action:</label>
                <select
                    class="w-[130px] bg-surface border border-outline-variant rounded-lg px-3 py-1.5 text-body-sm font-medium focus:outline-none focus:ring-1 focus:ring-primary">
                    <option>Last 24 Hours</option>
                    <option>Last 7 Days</option>
                    <option>Last 30 Days</option>
                </select>
            </div>

            <button type="button" id="adminRefreshLog" class="px-4 py-2
                       rounded-lg
                       text-[12px]
                       bg-button-active
                       text-text-active
                       hover:opacity-85
                       transition-opacity
                       flex items-center gap-2 shadow-sm" onclick="location.reload()">

                <span class="material-symbols-outlined text-[12px]">
                    refresh
                </span>

                Refresh
            </button>

        </div>

    </header>

    <!-- Main Content Area -->
    <main class="w-full min-h-[calc(100vh-106px)] bg-surface pt-6">
        <!-- Page Content Scrollable Area -->
        <div class="flex-1 overflow-y-auto p-container-padding lg:p-margin-lg">
            <div class="max-w-[1600px] mx-auto space-y-gutter">

                <!-- Main Data Table Section -->
                <div
                    class="bg-surface-container-lowest border border-[#E2E8F0] rounded-2xl shadow-card overflow-hidden flex flex-col">

                    <!-- Table Container -->
                    <div class="overflow-x-auto table-container">
                        <table class="w-full text-left border-collapse whitespace-nowrap min-w-[1000px]">
                            <thead>
                                <tr class="bg-text-active border-b border-[#E2E8F0]">
                                    <th
                                        class="py-3 px-4 font-label-md text-label-md text-on-surface-variant uppercase tracking-wider sticky left-0 z-10">
                                        TIMESTAMP</th>
                                    <th
                                        class="py-3 px-4 font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">
                                        USER</th>
                                    <th
                                        class="py-3 px-4 font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">
                                        ROLE</th>
                                    <th
                                        class="py-3 px-4 font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">
                                        Team</th>
                                    <th
                                        class="py-3 px-4 font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">
                                        ACTION</th>
                                    <th
                                        class="py-3 px-4 font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">
                                        STATUS</th>
                                    <th
                                        class="py-3 px-4 font-label-md text-label-md text-on-surface-variant uppercase tracking-wider text-right pr-6">
                                        ACTION</th>
                                </tr>
                            </thead>
                            <tbody class="font-code text-code divide-y divide-[#E2E8F0]">
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <div class="px-6 py-4
                        bg-text-active
                        border-t border-slate-200
                        flex items-center
                        justify-center">


                        <!-- Pagination -->
                        <div class="flex items-center gap-6">

                            <!-- Previous -->
                            <button class="w-9 h-9
                                    flex items-center justify-center
                                    rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">

                                <span class="material-symbols-outlined text-[20px]">
                                    chevron_left
                                </span>

                            </button>


                            <!-- Page 1 -->
                            <button class="w-9 h-9
                                   rounded-lg
                                   bg-button-active
                                   text-text-active
                                   text-sm
                                   font-medium">
                                1
                            </button>


                            <!-- Page 2 -->
                            <button class="w-9 h-9
                                   rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">
                                2
                            </button>


                            <!-- Page 3 -->
                            <button class="w-9 h-9
                                   rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">
                                3
                            </button>


                            <!-- Page 4 -->
                            <button class="w-9 h-9
                                   rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">
                                4
                            </button>


                            <!-- Page 5 -->
                            <button class="w-9 h-9
                                   rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">
                                5
                            </button>


                            <!-- Page 6 -->
                            <button class="w-9 h-9
                                   rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">
                                6
                            </button>


                            <!-- Next -->
                            <button class="w-9 h-9
                                    flex items-center justify-center
                                    rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">

                                <span class="material-symbols-outlined text-[20px]">
                                    chevron_right
                                </span>

                            </button>

                        </div>

                    </div>

                </div>
            </div>
        </div>
    </main>
    <!-- Detail Drawer Overlay -->
    <div class="fixed inset-0 bg-on-surface/20 backdrop-blur-[2px] z-50 hidden transition-opacity" id="drawer-overlay"
        onclick="closeDrawer()"></div>
    <!-- Detail Drawer (Right Side) -->
    <aside
        class="fixed top-0 right-0 h-full w-full max-w-[400px] bg-surface-container-lowest border-l border-outline-variant shadow-2xl z-50 flex flex-col"
        id="detail-drawer">
        <!-- Drawer Header -->
        <div class="flex items-center justify-between p-container-padding border-b border-outline-variant bg-surface">
            <div>
                <h3 class="font-headline-sm text-headline-sm font-bold text-on-surface">Log Details</h3>
                <p class="font-code text-[11px] text-on-surface-variant mt-1">ID: LOG-20241024-998A2B</p>
            </div>
            <button class="p-2 rounded-full hover:bg-surface-container-low text-on-surface-variant transition-colors"
                onclick="closeDrawer()">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <div class="flex-1 overflow-y-auto p-container-padding space-y-6" aria-live="polite"></div>
        <!-- Drawer Footer Actions -->
        <div class="p-container-padding border-t border-outline-variant bg-surface flex flex-col gap-3">
            <button
                class="w-full py-2.5 bg-surface text-primary border border-primary rounded-lg font-label-md text-label-md hover:bg-primary-container transition-colors flex justify-center items-center gap-2">
                <span class="material-symbols-outlined text-[18px]">hub</span>
                View Related Activities
            </button>
            <button
                class="w-full py-2.5 bg-status-error text-on-error rounded-lg font-label-md text-label-md hover:bg-status-error/90 transition-colors shadow-sm">
                Block IP Temporarily
            </button>
        </div>
    </aside>
    <script src="../../JavaScript/adminLogView.js"></script>

    <script src="../../JavaScript/api.js"></script>
    <script src="../../JavaScript/navbar.js"></script>
    <script src="../../JavaScript/workspace.js"></script>
</body>

</html>
