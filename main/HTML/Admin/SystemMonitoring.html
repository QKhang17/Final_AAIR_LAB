<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>System  Monitoring</title>
    <link rel="icon" type="image/png" href="../../../resource/icon/logo_remove_BG.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Google Fonts -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap">

    <!-- Material Symbols -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap">

    <!-- AAIR Tailwind Configuration -->
    <script src="../../JavaScript/tailwind.js"></script>

    <!-- Page-specific CSS -->
    <link href="../../Style/basic.css" rel="stylesheet"/>
    <link href="../../Style/navbar.css" rel="stylesheet"/>
    <link href="../../Style/jellykeyDesignSystem.css" rel="stylesheet">
</head>

<body class="bg-surface text-on-surface selection:bg-primary-container selection:text-on-primary-container">

    <!-- Unified Navbar Mount -->
    <div data-aair-navbar-mount></div>

    <!-- TopNavBar -->
    <header class="w-full h-12
           flex items-center px-6
           bg-text-active border-b border-outline-variant
           shadow-sm sticky top-[58px] z-30 mb-6">

        <div class="flex items-center">
            <h2 class="text-lg font-bold text-on-surface" data-greeting>
                Good Morning,
            </h2>
        </div>
        <!-- Buttons -->
        <div class="ml-auto flex items-center gap-2">
            <button type="butotn"
                    class="px-4 py-2
                       rounded-lg
                       text-[12px]
                       bg-button-active
                       text-text-active
                       hover:opacity-85
                       transition-opacity
                       flex items-center gap-2 shadow-sm"
                    onclick="location.reload()">

                <span class="material-symbols-outlined text-[12px]">
                    refresh
                </span>

                Refresh
            </button>

        </div>

    </header>

    <!-- Main Content Canvas -->
    <main class="w-full min-h-[calc(100vh-106px)] bg-surface pt-6">
    </main>
    
    <script src="../../JavaScript/api.js"></script>
    <script src="../../JavaScript/navbar.js"></script>
    <script src="../../JavaScript/greeting.js"></script>
    <script src="../../JavaScript/workspace.js"></script>
</body>

</html>
