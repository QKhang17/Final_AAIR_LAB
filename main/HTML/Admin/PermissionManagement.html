<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permission Management</title>
    <link rel="icon" type="image/png" href="../../../resource/icon/logo_remove_BG.png">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap">
    <script src="../../JavaScript/tailwind.js"></script>
    <link href="../../Style/basic.css" rel="stylesheet">
    <link href="../../Style/jellykeyDesignSystem.css" rel="stylesheet">

<body class="bg-surface text-on-surface selection:bg-primary-container selection:text-on-primary-container">
    <header class="fixed top-0 left-0 right-0 h-[58px] bg-normal border-b border-outline-variant flex items-center px-2 z-50">
        <div class="flex items-center gap-2 mr-6">
            <img src="/resource/icon/logo_remove_BG.png" alt="AAIR Lab Logo" class="h-8 w-auto" width="32" height="32">
            <h1 class="font-headline-sm text-[14px] font-bold text-primary">AAIR Lab</h1>
        </div>
        <div class="h-12 w-[1px] bg-outline-variant ms-2"></div>
        <nav class="flex items-center h-full">
            <a href="../../HTML/Admin/Dashboard.html" class="flex items-center px-4 h-full text-on-surface-variant hover:text-text-hover hover:bg-button-hover transition-colors"><span class="font-body-md text-[12px]">Dashboard</span></a>
            <div class="h-12 w-[1px] bg-outline-variant"></div>
            <a href="../../HTML/Admin/ManagerManagement.html" class="flex items-center px-4 h-full text-on-surface-variant hover:text-text-hover hover:bg-button-hover transition-colors"><span class="font-body-md text-[12px]">Users</span></a>
            <div class="h-12 w-[1px] bg-outline-variant"></div>
            <a href="../../HTML/Admin/PermissionManagement.html" class="flex items-center px-4 h-full text-text-active bg-button-active transition-colors"><span class="font-body-md text-[12px]">Permission</span></a>
            <div class="h-12 w-[1px] bg-outline-variant"></div>
            <a href="../../HTML/Admin/LogView.html" class="flex items-center px-4 h-full text-on-surface-variant hover:text-text-hover hover:bg-button-hover transition-colors"><span class="font-body-md text-[12px]">Audit Logs</span></a>
        </nav>
        <div class="ml-auto flex items-center gap-3">
            <div class="w-7 h-7 rounded-full bg-primary-container/10 flex items-center justify-center text-primary font-bold"></div>
            <div class="hidden md:block"><p class="text-[12px] font-bold text-on-surface"></p><p class="text-[8px] text-on-surface-variant uppercase tracking-wider"></p></div>
        </div>
    </header>
    <header class="w-full h-12 flex items-center px-6 bg-text-active border-b border-outline-variant shadow-sm sticky top-[58px] z-30 mb-6">
        <div class="mx-auto flex w-full max-w-[1540px] items-center justify-end gap-2 px-6">
            <button class="px-4 py-2 rounded-lg text-[12px] bg-button-active text-text-active hover:opacity-85 transition-opacity flex items-center gap-2 shadow-sm disabled:cursor-not-allowed disabled:opacity-50" id="permissionToolbarSave" disabled>
                <span class="material-symbols-outlined text-[12px]">save</span>Save Changes
            </button>
        </div>
    </header>
    <main class="w-full min-h-[calc(100vh-106px)] bg-surface pt-6" aria-busy="true"></main>
    <script src="../../JavaScript/api.js"></script>
    <script src="../../JavaScript/permissionManagement.js"></script>
    <script src="../../JavaScript/workspace.js"></script>
