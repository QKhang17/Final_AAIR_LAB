<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>View All Session</title>
    <link rel="icon" type="image/png" href="/resource/icon/logo_remove_BG.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap">

    <!-- Material Symbols -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <script src="../../../JavaScript/tailwind.js"></script>

    <link href="../../../Style/basic.css" rel="stylesheet" />

    <style>
        .ai-task-list-page{--task-row-height:52px;--task-muted:#526473;background:#f4f7f9;color:#101828;font-family:Inter,Arial,sans-serif;}
        .ai-task-list-page :where(button,input,select,label,th,td){font-family:inherit;}
        .ai-task-list-page .ai-task-toolbar{margin-top:58px!important;height:48px;}
        .ai-task-list-page .ai-task-toolbar input{height:40px!important;font-size:13px;}
        .ai-task-list-page .filter-select{min-width:120px!important;height:40px!important;padding:0 28px 0 12px!important;font-size:13px!important;font-weight:500!important;}
        .ai-task-list-page .ai-task-content{padding:24px!important;}
        .ai-task-page-title{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:24px;}
        .ai-task-page-title h1{margin:0;font-size:22px!important;line-height:28px;font-weight:600!important;color:#101828!important;}
        .ai-task-page-title p{margin:4px 0 0;color:#667085;font-size:13px;}
        .ai-task-list-page #taskTable{width:100%;table-layout:fixed;border-collapse:collapse;}
        .ai-task-list-page #taskTable th,.ai-task-list-page #taskTable td{height:var(--task-row-height);padding:0 16px!important;text-align:left;vertical-align:middle;}
        .ai-task-list-page #taskTable th{font-size:12px!important;font-weight:600!important;letter-spacing:.04em;text-transform:uppercase;color:#526473!important;}
        .ai-task-list-page #taskTable th:last-child,.ai-task-list-page #taskTable td:last-child{text-align:right;}
        .ai-task-list-page #taskTable th:nth-child(1),.ai-task-list-page #taskTable td:nth-child(1){width:28%;}
        .ai-task-list-page #taskTable th:nth-child(2),.ai-task-list-page #taskTable td:nth-child(2){width:14%;color:var(--task-muted);font-size:13px!important;font-weight:400!important;}
        .ai-task-list-page #taskTable th:nth-child(3),.ai-task-list-page #taskTable td:nth-child(3){width:18%;}
        .ai-task-list-page #taskTable th:nth-child(4),.ai-task-list-page #taskTable td:nth-child(4){width:22%;color:var(--task-muted);font-size:13px!important;font-weight:400!important;}
        .ai-task-list-page #taskTable th:nth-child(5),.ai-task-list-page #taskTable td:nth-child(5){width:18%;}
        .ai-task-list-page #taskTable tbody tr{border-top:1px solid #e5eaee;transition:background .15s ease;}
        .ai-task-list-page #taskTable tbody tr:hover{background:#f7fbfd;}
        .ai-task-list-page .cell-primary{display:inline-block;color:#101828!important;font-size:14px!important;font-weight:500!important;text-decoration:none;}
        .ai-task-list-page .cell-primary:hover{text-decoration:underline;color:#075985!important;}
        .ai-task-list-page .task-status,.ai-task-list-page .task-type{display:inline-flex;align-items:center;min-height:24px;padding:3px 9px;border-radius:999px;font-size:12px!important;font-weight:600!important;}
        .ai-task-list-page .task-status--pending{color:#475467;background:#f2f4f7;}.ai-task-list-page .task-status--progress{color:#175cd3;background:#dbeafe;}.ai-task-list-page .task-status--submitted{color:#6941c6;background:#f4ebff;}.ai-task-list-page .task-status--approved{color:#067647;background:#dff3e9;}.ai-task-list-page .task-status--rejected{color:#b42318;background:#fee4e2;}
        .ai-task-list-page .task-type{color:#475467;background:#eef2f6;font-weight:500!important;}
        .ai-task-list-page .task-action{display:inline-flex;align-items:center;justify-content:center;width:84px;height:32px;margin:0!important;border:1px solid #b8c7d1;border-radius:7px;background:#fff;color:#075985;font-size:13px!important;font-weight:600!important;text-decoration:none;}
        .ai-task-list-page .task-action:hover{background:#eef8fb;border-color:#078bb8;}
        .ai-task-list-page .task-pagination[hidden]{display:none!important;}
        /* Keep AI Labeler My Tasks identical to the Manual Labeler session view. */
        .ai-task-list-page .ai-task-content{padding:24px!important;}
        .ai-task-list-page .ai-task-page-title{align-items:flex-start;gap:16px;margin-bottom:24px;}
        .ai-task-list-page .ai-task-page-title h1{font-size:22px!important;line-height:28px;font-weight:600!important;}
        .ai-task-list-page #taskTable{min-width:720px;table-layout:fixed;}
        .ai-task-list-page #taskTable th,.ai-task-list-page #taskTable td{height:52px;padding:10px 16px!important;vertical-align:middle;}
        .ai-task-list-page #taskTable th:nth-child(1),.ai-task-list-page #taskTable td:nth-child(1){width:65%;}
        .ai-task-list-page #taskTable th:nth-child(2),.ai-task-list-page #taskTable td:nth-child(2){width:20%;}
        .ai-task-list-page #taskTable th:nth-child(3),.ai-task-list-page #taskTable td:nth-child(3){width:15%;}
        .ai-task-list-page .task-session-header td{height:auto;padding:14px 16px 10px!important;border-top:1px solid #cbd5e1;border-bottom:0;background:#f0f8fa;}
        .ai-task-list-page .task-session-header:first-child td{border-top:0;}
        .ai-task-list-page .task-session-header__top{display:flex;align-items:center;justify-content:space-between;gap:12px;}
        .ai-task-list-page .task-session-header__name{color:#101828;font-size:14px;font-weight:700;}
        .ai-task-list-page .task-session-header__meta{color:#475467;font-size:12px;}
        .ai-task-list-page .task-session-header__meta--overdue{color:#b42318;font-weight:700;}
        .ai-task-list-page .task-session-header__meta--complete{color:#067647;font-weight:700;}
        .ai-task-list-page .task-session-progress{height:6px;margin-top:8px;overflow:hidden;border-radius:999px;background:#dbe7eb;}
        .ai-task-list-page .task-session-progress span{display:block;height:100%;border-radius:inherit;background:#087fa8;}
        .ai-task-list-page .task-session-file td:first-child{padding-left:28px!important;}
        .ai-task-list-page .task-session-file .cell-primary{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
        .ai-task-list-page .task-session-file .task-action-cell{padding-right:20px!important;text-align:right;}
        .ai-task-list-page .task-empty-state{padding:36px 16px!important;color:#667085!important;text-align:center;}
        .ai-task-list-page .task-status--pending{color:#9a6700;background:#fff4cc;}
        .ai-task-list-page .task-status--awaiting-review{color:#6941c6;background:#f4ebff;}
        .ai-task-list-page .task-status--returned{color:#b42318;background:#fee4e2;}
        .ai-task-list-page .task-action--start{border-color:#087fa8;color:#fff!important;background:#087fa8;}
        .ai-task-list-page .task-action--start:hover{border-color:#075985;color:#fff!important;background:#075985;}
        .ai-task-list-page .task-action--continue{border-color:#8ccbdc;color:#075985!important;background:#e6f7fb;}
        .ai-task-list-page .task-action--review,.ai-task-list-page .task-action--view{border-color:#cbd5e1;color:#344054!important;background:#fff;}
        .ai-task-list-page .task-action--review:hover,.ai-task-list-page .task-action--view:hover{border-color:#175cd3;color:#175cd3!important;background:#f8fbff;}
        @media(max-width:800px){.ai-task-page-title{align-items:flex-start;flex-direction:column}.ai-task-list-page #taskTable{min-width:760px}.ai-task-list-page .ai-task-content{padding:16px!important;}}
    </style>

    <link href="../../../Style/jellykeyDesignSystem.css" rel="stylesheet">
</head>

<body class="ai-task-list-page bg-surface text-on-surface selection:bg-primary-container selection:text-on-primary-container">

    <!-- Fixed Header -->
    <header
        class="fixed top-0 left-0 right-0 h-[58px] bg-normal border-b border-outline-variant flex items-center px-2 z-50">

        <!-- AAIR Logo -->
        <div class="flex items-center gap-2 mr-6">
            <img src="/resource/icon/logo_remove_BG.png" alt="AAIR Lab Logo" class="h-8 w-auto" width="32" height="32" style="height:32px;width:auto;max-height:32px;object-fit:contain;">

            <h1 class="font-headline-sm text-[14px] font-bold text-primary">
                AAIR Lab
            </h1>
        </div>

        <div class="h-12 w-[1px] bg-outline-variant ms-2"></div>

        <!-- Navigation -->
        <nav class="flex items-center h-full">

            <a class="flex items-center gap-2 px-4 h-full
                   text-on-surface-variant
                   hover:text-text-hover
                   hover:bg-button-hover
                   transition-colors duration-200" href="../../User/AILabeling/Dashboard.html">
                <span class=" material-symbols-outlined" data-icon="dashboard">dashboard</span>
                <span class="font-body-md text-[12px]">Dashboard</span>
            </a>

            <div class="h-12 w-[1px] bg-outline-variant "></div>

            <a class="flex items-center gap-2 px-4 h-full
                   text-text-active
                   bg-button-active
                   transition-colors duration-200" href="../../User/AILabeling/ViewAll.html">
                <span class="material-symbols-outlined">list_alt </span>
                <span class="font-body-md text-[12px]">My Tasks</span>
            </a>
            <div class="h-12 w-[1px] bg-outline-variant"></div>
            <a class="flex items-center gap-2 px-4 h-full
                   text-on-surface-variant
                   hover:text-text-hover
                   hover:bg-button-hover
                   transition-colors duration-200" href="../../User/AILabeling/Task.html">
                <span class="material-symbols-outlined">play_circle</span>
                <span class="font-body-md text-[12px]">Session</span>
            </a>

            <div class="h-12 w-[1px] bg-outline-variant"></div>

            <a class="flex items-center gap-2 px-4 h-full
                   text-on-surface-variant
                   hover:text-text-hover
                   hover:bg-button-hover
                   transition-colors duration-200" href="../../User/AILabeling/Prompt.html">
                <span class="material-symbols-outlined">description</span>
                <span class="font-body-md text-[12px]">Prompt</span>
            </a>

            <div class="h-12 w-[1px] bg-outline-variant"></div>

        </nav>

        <!-- User Profile -->
        <div class="ml-auto flex items-center gap-3">

            <div class="w-7 h-7 rounded-full
                   bg-primary-container/10
                   flex items-center justify-center
                   text-primary font-bold">
                E
            </div>

            <div class="hidden md:block">
                <p class="text-[12px] font-bold text-on-surface">
                    NV. E
                </p>
            <p class="text-[11px] font-semibold text-on-surface-variant uppercase tracking-wider">
                    AI LABELER
                </p>
            </div>

        </div>

    </header>

    <!-- TopNavBar -->
    <header class="ai-task-toolbar w-full h-12
           flex items-center gap-2 px-6
           bg-text-active border-b border-outline-variant
           shadow-sm sticky top-[58px] z-30 mb-6">

        <!-- Search Box - Left -->
        <div class="relative w-[280px]">

            <span class="material-symbols-outlined
                     absolute left-3 top-1/2
                     -translate-y-1/2
                     text-slate-400 text-[20px]">
                search
            </span>

            <input id="taskSearch" type="text" placeholder="Search tasks…" class="w-full h-8
                   pl-10 pr-4
                   rounded-lg
                   border border-slate-300
                   bg-white
                   text-sm
                   outline-none
                   focus:border-blue-500
                   focus:ring-2
                   focus:ring-blue-100">
        </div>

        <!-- Buttons -->
        <div class="ml-auto flex items-center gap-2">

            <div class="flex items-center gap-2">
                <label class="text-label-md text-on-surface-variant">Session:</label>
                <select
                    id="taskSessionFilter" class="filter-select bg-surface border border-outline-variant rounded-lg px-3 py-1.5 text-body-sm font-medium focus:outline-none focus:ring-1 focus:ring-primary">
                    <option>All</option>
                    <option>001</option>
                    <option>002</option>
                </select>
            </div>

        </div>

    </header>

    <!-- =========================================================
     MAIN CONTENT — VIEW ALL DOCUMENTS
========================================================= -->

    <main class="w-full min-h-[calc(100vh-98px)] overflow-y-auto overflow-x-hidden">

        <!-- ===================================================== -->
        <!-- PAGE CONTENT -->
        <!-- ===================================================== -->

    <section class="ai-task-content">
            <div class="ai-task-page-title">
                <div><h1>My Tasks</h1><p data-task-count>Tasks assigned to you</p></div>
            </div>

            <!-- ================================================= -->
            <!-- DOCUMENT TABLE -->
            <!-- ================================================= -->

            <div class="bg-white
                    border border-slate-200
                    rounded-xl
                    overflow-hidden">

                <!-- Table -->
                <div class="overflow-x-auto">

                    <table id="taskTable" class="w-full text-sm">

                        <!-- ================================================= -->
                        <!-- TABLE HEADER -->
                        <!-- ================================================= -->

                        <thead class="bg-text-active
                                  border-b border-slate-200">

                            <tr>

                                <th class="px-6 py-3
                                       text-left
                                       font-semibold
                                       text-slate-600">
                                    Document
                                </th>

                                <th class="px-6 py-3
                                       text-left
                                       font-semibold
                                       text-slate-600">
                                    Status
                                </th>

                                <th class="px-6 py-3
                                       text-right
                                       font-semibold
                                       text-slate-600">
                                    Action
                                </th>

                            </tr>

                        </thead>


                        <!-- ================================================= -->
                        <!-- TABLE BODY -->
                        <!-- ================================================= -->

<tbody id="taskRows" class="divide-y divide-slate-100"></tbody>

                    </table>

                </div>


                <!-- ================================================= -->
                <!-- PAGINATION -->
                <!-- ================================================= -->

                <div class="task-pagination px-6 py-4
                        bg-text-active
                        border-t border-slate-200
                        flex items-center
                        justify-center">


                    <!-- Pagination -->
                    <div id="taskPagination" class="flex items-center gap-6">

                        <!-- Previous -->
                        <button class="w-9 h-9
                                    flex items-center justify-center
                                    rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">

                            <span class="material-symbols-outlined text-[20px]">
                                chevron_left
                            </span>

                        </button>


                        <!-- Page 1 -->
                        <button class="w-9 h-9
                                   rounded-lg
                                   bg-button-active
                                   text-text-active
                                   text-sm
                                   font-medium">
                            1
                        </button>


                        <!-- Page 2 -->
                        <button class="w-9 h-9
                                   rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">
                            2
                        </button>


                        <!-- Page 3 -->
                        <button class="w-9 h-9
                                   rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">
                            3
                        </button>


                        <!-- Page 4 -->
                        <button class="w-9 h-9
                                   rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">
                            4
                        </button>


                        <!-- Page 5 -->
                        <button class="w-9 h-9
                                   rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">
                            5
                        </button>


                        <!-- Page 6 -->
                        <button class="w-9 h-9
                                   rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">
                            6
                        </button>


                        <!-- Next -->
                        <button class="w-9 h-9
                                    flex items-center justify-center
                                    rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">

                            <span class="material-symbols-outlined text-[20px]">
                                chevron_right
                            </span>

                        </button>

                    </div>

                </div>

            </div>

        </section>

    </main>
    <script src="../../../JavaScript/api.js"></script>
    <script src="../../../JavaScript/workspace.js"></script>
</body>

</html>
