<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Working Session</title>
    <link rel="icon" type="image/png" href="/resource/icon/logo_remove_BG.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap">

    <!-- Material Symbols -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <script src="../../../JavaScript/tailwind.js"></script>

    <link href="../../../Style/basic.css" rel="stylesheet" />
    <link href="../../../Style/taskWorkspace.css" rel="stylesheet" />
    <link href="../../../Style/sessionCompletion.css" rel="stylesheet" />

    <link href="../../../Style/jellykeyDesignSystem.css" rel="stylesheet">
</head>

<body
    class="ai-task-page bg-surface text-on-surface selection:bg-primary-container selection:text-on-primary-container overflow-hidden">

    <!-- Fixed Header -->
    <header
        class="fixed top-0 left-0 right-0 h-[58px] bg-normal border-b border-outline-variant flex items-center px-2 z-50">

        <!-- AAIR Logo -->
        <div class="flex items-center gap-2 mr-6">
            <img src="/resource/icon/logo_remove_BG.png" alt="AAIR Lab Logo" class="h-8 w-auto" width="32" height="32" style="height:32px;width:auto;max-height:32px;object-fit:contain;">

            <h1 class="font-headline-sm text-[14px] font-bold text-primary">
                AAIR Lab
            </h1>
        </div>

        <div class="h-12 w-[1px] bg-outline-variant ms-2"></div>

        <!-- Navigation -->
        <nav class="flex items-center h-full">

            <a class="flex items-center gap-2 px-4 h-full
                   text-on-surface-variant
                   hover:text-text-hover
                   hover:bg-button-hover
                   transition-colors duration-200" href="../../User/AILabeling/Dashboard.html">
                <span class=" material-symbols-outlined" data-icon="dashboard">dashboard</span>
                <span class="font-body-md text-[12px]">Dashboard</span>
            </a>

            <div class="h-12 w-[1px] bg-outline-variant"></div>

            <a class="flex items-center gap-2 px-4 h-full
                   text-on-surface-variant
                   hover:text-text-hover
                   hover:bg-button-hover
                   transition-colors duration-200" href="../../User/AILabeling/ViewAll.html">
                <span class="material-symbols-outlined">list_alt </span>
                <span class="font-body-md text-[12px]">My Tasks</span>
            </a>

            <div class="h-12 w-[1px] bg-outline-variant"></div>

            <a class="flex items-center gap-2 px-4 h-full
                   text-text-active
                   bg-button-active
                   transition-colors duration-200" href="../../User/AILabeling/Task.html">
                <span class="material-symbols-outlined">play_circle</span>
                <span class="font-body-md text-[12px]">Session</span>
            </a>

            <div class="h-12 w-[1px] bg-outline-variant"></div>

            <a class="flex items-center gap-2 px-4 h-full
                   text-on-surface-variant
                   hover:text-text-hover
                   hover:bg-button-hover
                   transition-colors duration-200" href="../../User/AILabeling/Prompt.html">
                <span class="material-symbols-outlined">description</span>
                <span class="font-body-md text-[12px]">Prompt</span>
            </a>

            <div class="h-12 w-[1px] bg-outline-variant"></div>

        </nav>

        <!-- User Profile -->
        <div class="ml-auto flex items-center gap-3">

            <div class="w-7 h-7 rounded-full
                   bg-primary-container/10
                   flex items-center justify-center
                   text-primary font-bold">
                E
            </div>

            <div class="hidden md:block">
                <p class="text-[12px] font-bold text-on-surface">
                    NV. E
                </p>
                <p class="text-[8px] text-on-surface-variant uppercase tracking-wider">
                    AI Labeler
                </p>
            </div>

        </div>

    </header>

    <!-- TopNavBar -->
    <header class="manual-session-toolbar mt-[50px] ml-[157px] w-[calc(100%-157px)] h-12
           flex items-center gap-2 px-6
           bg-text-active border-b border-outline-variant
           shadow-sm sticky top-[58px] z-30 gap-4">

        <h2 id="sessionTitle" class="text-lg font-bold text-on-surface whitespace-nowrap">Loading session...</h2>

        <div id="sessionProgressTrack" class="w-48 bg-surface-container-highest h-2 rounded-full overflow-hidden" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="sessionProgressBar" class="h-full aair-gradient rounded-full transition-all duration-500 ease-out" style="width:0%"></div>
        </div>

        <span id="sessionProgressText" class="text-label-sm font-bold text-primary whitespace-nowrap">0/0 documents · 0%</span>


        <!-- Buttons -->
        <div class="task-toolbar-actions ml-auto flex items-center gap-3">

            <div class="flex items-center gap-2">
                <label class="text-label-md text-on-surface-variant">Model:</label>
                <select
                    class="w-[170px] bg-surface border border-outline-variant rounded-lg px-4 py-2 text-body-sm font-medium focus:outline-none focus:ring-1 focus:ring-primary">
                    <option>Choose Model</option>
                    <option>Gemini</option>
                    <option>Claude</option>
                    <option>ChatGPT</option>
                    <option>Groq</option>
                </select>
            </div>

            <div class="w-px h-6 bg-outline-variant mx-2"></div>

            <button id="runAiButton" type="button" class="task-toolbar-button task-toolbar-button--run px-4 py-2
                       rounded-lg text-[12px]
                       flex items-center gap-2 shadow-sm">
                <span class="task-button-label">Run AI</span>
            </button>

            <button id="taskSaveButton" type="button" class="task-toolbar-button task-toolbar-button--save px-4 py-2
                       rounded-lg text-[12px]
                       flex items-center gap-2 shadow-sm" aria-label="Save" disabled>
                <span class="task-button-label">Save</span>
            </button>

            <button type="button" class="ai-submit-button task-toolbar-button task-toolbar-button--submit px-4 py-2
                       rounded-lg
                       text-[12px]
                       flex items-center gap-2 shadow-sm">
                <span class="task-button-label">Submit Task</span>
            </button>

        </div>

    </header>

    <!-- Fixed Sidebar -->
    <aside class="fixed left-0 top-[58px] h-[calc(100vh-58px)] w-[157px]
       bg-surface border-r border-outline-variant
       flex flex-col z-40 items-center">

        <!-- Select All -->
        <div class="w-full px-3 py-3 border-b border-outline-variant">

            <label class="flex items-center gap-2 cursor-pointer
                      text-sm text-on-surface">

                <input type="checkbox" id="selectAll" class="w-4 h-4 rounded border-outline-variant
                       text-primary focus:ring-primary">

                <span>Select All</span>

            </label>

        </div>


        <!-- PDF List -->
        <div id="documentList" class="w-full py-3 space-y-1">
            <button type="button" class="document-item hidden" aria-hidden="true"></button>
        </div>


        <!-- Selected Counter -->
        <div id="selectedCounter" class="hidden mt-auto w-full px-3 py-3
               border-t border-outline-variant
               text-center">

            <span id="selectedCount" class="text-xs font-medium text-on-surface-variant">
                0 documents
            </span>

        </div>

    </aside>

    <!-- Main Workspace -->
    <main class="ml-[157px] w-[calc(100%-157px)]
            h-[calc(100vh-98px)]
            mt-0
            grid grid-cols-[62%_38%]
            overflow-hidden">

        <!-- ================================================= -->
        <!-- LEFT 50% — PROMPT EDITOR -->
        <!-- ================================================= -->

        <section class="min-w-0 min-h-0
                    border-r border-outline-variant
                    bg-white
                    flex flex-col overflow-hidden">

            <!-- PDF Viewer -->
            <div class="flex-1 p-4 bg-surface-container">

                <iframe id="pdfViewer" src="" class=" w-full h-full
                   border-0
                   rounded-lg
                   bg-white
                   shadow-sm">
                </iframe>

            </div>


        </section>



        <!-- ================================================= -->
        <!-- RIGHT 50% -->
        <!-- ================================================= -->

        <div class="min-w-0 min-h-0
                grid grid-cols-1
                grid-rows-[100%]
                overflow-hidden"> 
                
            <section class="min-w-0 min-h-0
                bg-white
                border-b border-outline-variant
                flex flex-col
                overflow-hidden">


                <!-- ============================================= -->
                <!-- HEADER -->
                <!-- ============================================= -->

                <div class="h-12 shrink-0
                px-4
                flex items-center
                border-b border-outline-variant
                bg-surface-container-low/30">

                    <div class="flex min-w-0 flex-1 items-center gap-2">

                        <span class="material-symbols-outlined
                         text-primary text-[20px]">
                            article
                        </span>

                        <h2 class="text-sm font-semibold text-on-surface">
                            AI Extraction
                        </h2>

                    </div>

                    <div id="aiPromptControls" class="ml-auto flex min-w-0 items-center gap-2">
                        <label for="aiPromptSelect" class="shrink-0 text-[11px] font-semibold text-on-surface-variant">Prompt</label>
                        <select id="aiPromptSelect" class="min-w-0 max-w-[230px] rounded-lg border border-outline-variant bg-white px-2 py-1.5 text-[11px] focus:outline-none focus:ring-1 focus:ring-primary">
                            <option value="__default__">System default prompt</option>
                        </select>
                    </div>

                </div>


                <!-- ============================================= -->
                <!-- SCROLLABLE CONTENT -->
                <!-- ============================================= -->

                <div class="flex-1 min-h-0
                overflow-y-auto
                overflow-x-hidden
                p-5
                custom-scrollbar">

                    <div data-annotation-panel>
                        <h3 class="text-sm font-semibold text-on-surface mb-3">Extracted Information</h3>
                    </div>

            </section>



        </div>

    </main>
    <script src="../../../JavaScript/api.js"></script>
    <script src="../../../JavaScript/timeTracking.js"></script>
    <script src="../../../JavaScript/sessionCompletion.js"></script>
    <script src="../../../JavaScript/workspace.js"></script>
</body>

</html>
