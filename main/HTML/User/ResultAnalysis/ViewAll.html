<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>View All Session</title>
    <link rel="icon" type="image/png" href="/resource/icon/logo_remove_BG.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap">

    <!-- Material Symbols -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <script src="../../../JavaScript/tailwind.js"></script>

    <link href="../../../Style/basic.css" rel="stylesheet" />
    <link href="../../../Style/shared.css" rel="stylesheet" />
    <link href="../../../Style/navbar.css" rel="stylesheet" />
    <link href="../../../Style/analystTaskList.css?v=20261018" rel="stylesheet" />

    <link href="../../../Style/jellykeyDesignSystem.css" rel="stylesheet">
</head>

<body class="aa-shared-page bg-surface text-on-surface selection:bg-primary-container selection:text-on-primary-container">

    <div data-aair-navbar-mount></div>

    <!-- TopNavBar -->
    <header class="aa-task-list-toolbar w-full h-12
           flex items-center gap-2 px-6
           bg-text-active border-b border-outline-variant
           shadow-sm sticky top-0 z-30 mb-6">

        <!-- Search Box - Left -->
                <div class="relative w-[280px]">

            <span class="material-symbols-outlined
                     absolute left-3 top-1/2
                     -translate-y-1/2
                     text-slate-400 text-[20px]">
                search
            </span>

                <input id="taskSearch" type="text" placeholder="Search tasks..." class="w-full h-8
                   pl-10 pr-4
                   rounded-lg
                   border border-slate-300
                   bg-white
                   text-sm
                   outline-none
                   focus:border-blue-500
                   focus:ring-2
                   focus:ring-blue-100">
        </div>

        <!-- Buttons -->
        <div class="ml-auto flex items-center gap-2">

            <div class="flex items-center gap-2">
                <label class="text-label-md text-on-surface-variant">Session:</label>
                    <select id="sessionFilter"
                    class="filter-select bg-surface border border-outline-variant rounded-lg px-3 py-1.5 text-body-sm font-medium focus:outline-none focus:ring-1 focus:ring-primary">
                    <option value="">All</option>
                    <option>001</option>
                    <option>002</option>
                </select>
            </div>

            <div class="flex items-center gap-2">
                <label class="text-label-md text-on-surface-variant">Status:</label>
                    <select id="statusFilter"
                    class="filter-select bg-surface border border-outline-variant rounded-lg px-3 py-1.5 text-body-sm font-medium focus:outline-none focus:ring-1 focus:ring-primary">
                    <option value="">All</option>
                    <option>Active</option>
                    <option>Disabled</option>
                </select>
            </div>

        </div>

    </header>

    <!-- =========================================================
     MAIN CONTENT — VIEW ALL DOCUMENTS
========================================================= -->

    <main class="aa-task-list-page w-full min-h-[calc(100vh-98px)] overflow-y-auto overflow-x-hidden">

        <!-- ===================================================== -->
        <!-- PAGE CONTENT -->
        <!-- ===================================================== -->

        <section class="aa-task-list-content">
            <div class="aa-page-heading"><h1>Task List</h1><p>Review and analyze assigned AI tasks.</p></div>

            <!-- ================================================= -->
            <!-- DOCUMENT TABLE -->
            <!-- ================================================= -->

            <div class="bg-white
                    border border-slate-200
                    rounded-xl
                    overflow-hidden">

                <!-- Table -->
                <div class="overflow-x-auto">

                    <table class="w-full text-sm">

                        <!-- ================================================= -->
                        <!-- TABLE HEADER -->
                        <!-- ================================================= -->

                        <thead class="bg-text-active
                                  border-b border-slate-200">

                            <tr>

                                <th class="px-6 py-3
                                       text-left
                                       font-semibold
                                       text-slate-600">
                                    Document
                                </th>

                                <th class="px-6 py-3
                                       text-left
                                       font-semibold
                                       text-slate-600">
                                    Session
                                </th>

                                <th class="px-6 py-3
                                       text-left
                                       font-semibold
                                       text-slate-600">
                                    Annotator
                                </th>

                                <th class="px-6 py-3
                                       text-right
                                       font-semibold
                                       text-slate-600">
                                    Loại
                                </th>

                                <th class="px-6 py-3
                                       text-left
                                       font-semibold
                                       text-slate-600">
                                    Status
                                </th>

                                <th class="px-6 py-3
                                       text-left
                                       font-semibold
                                       text-slate-600">
                                    Hạn nộp
                                </th>

                                <th class="px-6 py-3
                                       text-right
                                       font-semibold
                                       text-slate-600">
                                    Action
                                </th>

                            </tr>

                        </thead>


                        <!-- ================================================= -->
                        <!-- TABLE BODY -->
                        <!-- ================================================= -->

<tbody id="taskRows" class="divide-y divide-slate-100"></tbody>

                    </table>

                </div>


                <!-- ================================================= -->
                <!-- PAGINATION -->
                <!-- ================================================= -->

                <div id="staticPagination" class="px-6 py-4
                        bg-text-active
                        border-t border-slate-200
                        flex items-center
                        justify-center">


                    <!-- Pagination -->
                    <div class="flex items-center gap-6">

                        <!-- Previous -->
                        <button class="w-9 h-9
                                    flex items-center justify-center
                                    rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">

                            <span class="material-symbols-outlined text-[20px]">
                                chevron_left
                            </span>

                        </button>


                        <!-- Page 1 -->
                        <button class="w-9 h-9
                                   rounded-lg
                                   bg-button-active
                                   text-text-active
                                   text-sm
                                   font-medium">
                            1
                        </button>


                        <!-- Page 2 -->
                        <button class="w-9 h-9
                                   rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">
                            2
                        </button>


                        <!-- Page 3 -->
                        <button class="w-9 h-9
                                   rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">
                            3
                        </button>


                        <!-- Page 4 -->
                        <button class="w-9 h-9
                                   rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">
                            4
                        </button>


                        <!-- Page 5 -->
                        <button class="w-9 h-9
                                   rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">
                            5
                        </button>


                        <!-- Page 6 -->
                        <button class="w-9 h-9
                                   rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">
                            6
                        </button>


                        <!-- Next -->
                        <button class="w-9 h-9
                                    flex items-center justify-center
                                    rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">

                            <span class="material-symbols-outlined text-[20px]">
                                chevron_right
                            </span>

                        </button>

                    </div>

                </div>

            </div>

        </section>

    </main>
    <script src="../../../JavaScript/api.js"></script>
    <script src="../../../JavaScript/guidelineModal.js"></script>
    <script src="../../../JavaScript/navbar.js"></script>
    <script src="../../../JavaScript/resultAnalysisViewAll.js?v=20261018"></script>
</body>

</html>
