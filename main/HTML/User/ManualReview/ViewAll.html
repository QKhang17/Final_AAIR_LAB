<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Review Queue</title>
    <link rel="icon" type="image/png" href="/resource/icon/logo_remove_BG.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap">

    <!-- Material Symbols -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <script src="../../../JavaScript/tailwind.js"></script>

    <link href="../../../Style/basic.css" rel="stylesheet" />
    <style>
      :root{--gap-section:24px;--row-h:52px}
      .task-list-page{padding:24px!important}
      .review-queue-page > header:nth-of-type(2){margin-bottom:0!important}
      .review-queue-page > main{padding-top:0!important}
      .review-queue-page .task-list-page{padding:16px 24px 24px!important}
      .review-queue-page .task-list-page > div:first-child{margin-bottom:16px!important}
      .task-list-page h1{margin:0;font-size:22px;font-weight:600;color:#101828}.task-list-page p{margin:4px 0 0;font-size:13px;color:#667085}
      .filter-select{min-width:120px!important;height:40px!important;font-size:13px!important;font-weight:500!important}
      #taskTable{table-layout:fixed;min-width:960px}#taskTable th,#taskTable td{padding:10px 16px!important;height:var(--row-h);vertical-align:middle;text-align:left!important}#taskTable th{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#667085}#taskTable td{font-size:13px;color:#475467}#taskTable td:first-child a{font-size:14px;font-weight:500;color:#101828;text-decoration:none}#taskTable td:first-child a:hover{color:#175cd3;text-decoration:underline}#taskTable th:last-child,#taskTable td:last-child{text-align:right!important;width:112px}.task-action{display:inline-flex;align-items:center;justify-content:center;width:78px;min-height:32px;padding:0 10px;border:1px solid #cbd5e1;border-radius:7px;color:#344054!important;background:#fff;font-size:13px;font-weight:600}.task-action:hover{border-color:#175cd3;color:#175cd3!important;background:#f8fbff}.task-type,.task-status,.task-conflicts{display:inline-flex;align-items:center;min-height:24px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600}.task-type{color:#475467;background:#eef2f6;font-weight:500}.task-status--pending{color:#475467;background:#f2f4f7}.task-status--progress{color:#175cd3;background:#dbeafe}.task-status--submitted{color:#6941c6;background:#f4ebff}.task-status--approved{color:#067647;background:#dff3e9}.task-status--rejected{color:#b42318;background:#fee4e2}.task-conflicts{color:#667085;background:#f2f4f7}.task-conflicts--active{color:#b54708;background:#fef0c7}.task-pagination[hidden]{display:none}
    </style>

    <link href="../../../Style/jellykeyDesignSystem.css" rel="stylesheet">
</head>

<body class="review-queue-page bg-surface text-on-surface selection:bg-primary-container selection:text-on-primary-container">

    <header class="manual-navbar review-topbar">
        <a class="manual-navbar__brand review-brand" href="Dashboard.html" aria-label="AAIR Lab - Dashboard">
            <img src="/resource/icon/logo_remove_BG.png" alt="" class="h-8 w-auto" width="32" height="32" style="height:32px;width:auto;max-height:32px;object-fit:contain;">
            <strong>AAIR Lab</strong>
        </a>
        <nav class="manual-navbar__nav review-nav" aria-label="Navigation">
            <a href="Dashboard.html"><span class="material-symbols-outlined">dashboard</span><span>Dashboard</span></a>
            <a class="is-active" href="ViewAll.html" aria-current="page"><span class="material-symbols-outlined">list_alt</span><span>Review Queue</span></a>
        </nav>
        <div class="manual-navbar__account review-account">
            <span class="manual-navbar__avatar review-avatar">RE</span>
            <span class="manual-navbar__identity review-identity"><b>reviewer01</b><small>REVIEWER</small></span>
            <button class="manual-navbar__logout outline-button" type="button" title="Log out of the system">Log out</button>
        </div>
    </header>

    <!-- TopNavBar -->
    <header class="mt-[58px] w-full h-12
           flex items-center gap-2 px-6
           bg-text-active border-b border-outline-variant
           shadow-sm sticky top-[58px] z-30 mb-6">

        <!-- Search Box - Left -->
        <div class="relative w-[280px]">

            <span class="material-symbols-outlined
                     absolute left-3 top-1/2
                     -translate-y-1/2
                     text-slate-400 text-[20px]">
                search
            </span>

            <input type="text" placeholder="Search tasks…" class="w-full h-8
                   pl-10 pr-4
                   rounded-lg
                   border border-slate-300
                   bg-white
                   text-sm
                   outline-none
                   focus:border-blue-500
                   focus:ring-2
                   focus:ring-blue-100">
        </div>

        <!-- Buttons -->
        <div class="ml-auto flex items-center gap-2">

            <div class="flex items-center gap-2">
                <label class="text-label-md text-on-surface-variant">Session:</label>
                <select
                    class="filter-select min-w-[120px] h-10 bg-surface border border-outline-variant rounded-lg px-3 py-1.5 text-body-sm font-medium focus:outline-none focus:ring-1 focus:ring-primary">
                    <option>All</option>
                    <option>001</option>
                    <option>002</option>
                </select>
            </div>

            <div class="flex items-center gap-2">
                <label class="text-label-md text-on-surface-variant">Status:</label>
                <select
                    class="filter-select min-w-[120px] h-10 bg-surface border border-outline-variant rounded-lg px-3 py-1.5 text-body-sm font-medium focus:outline-none focus:ring-1 focus:ring-primary">
                    <option>All</option>
                    <option>Active</option>
                    <option>Disabled</option>
                </select>
            </div>

        </div>

    </header>

    <!-- =========================================================
     MAIN CONTENT — VIEW ALL DOCUMENTS
========================================================= -->

    <main class="w-full min-h-[calc(100vh-98px)] overflow-y-auto overflow-x-hidden pt-4">

        <!-- ===================================================== -->
        <!-- PAGE CONTENT -->
        <!-- ===================================================== -->

        <section class="task-list-page p-6">
            <div class="mb-6"><h1 class="text-[22px] font-semibold text-slate-900">Review Queue</h1><p class="mt-1 text-[13px] text-slate-500">Tasks assigned for review</p></div>

            <!-- ================================================= -->
            <!-- DOCUMENT TABLE -->
            <!-- ================================================= -->

            <div class="bg-white
                    border border-slate-200
                    rounded-xl
                    overflow-hidden">

                <!-- Table -->
                <div class="overflow-x-auto">

                    <table id="taskTable" class="task-list-table w-full text-sm">

                        <!-- ================================================= -->
                        <!-- TABLE HEADER -->
                        <!-- ================================================= -->

                        <thead class="bg-text-active
                                  border-b border-slate-200">

                            <tr>

                                <th class="px-6 py-3
                                       text-left
                                       font-semibold
                                       text-slate-600">
                                    Document
                                </th>

                                <th class="px-6 py-3
                                       text-left
                                       font-semibold
                                       text-slate-600">
                                    Session
                                </th>

                                <th class="px-6 py-3
                                       text-left
                                       font-semibold
                                       text-slate-600">
                                    Annotator
                                </th>

                                <th class="px-6 py-3
                                       text-right
                                       font-semibold
                                       text-slate-600">
                                    Type
                                </th>

                                <th class="px-6 py-3
                                       text-left
                                       font-semibold
                                       text-slate-600">
                                    Status
                                </th>

                                <th class="px-6 py-3
                                       text-left
                                       font-semibold
                                       text-slate-600">
                                    Due
                                </th>

                                <th class="px-6 py-3
                                       text-left
                                       font-semibold
                                       text-slate-600">
                                    Conflicts
                                </th>

                                <th class="px-6 py-3
                                       text-right
                                       font-semibold
                                       text-slate-600">
                                    Action
                                </th>

                            </tr>

                        </thead>


                        <!-- ================================================= -->
                        <!-- TABLE BODY -->
                        <!-- ================================================= -->

<tbody id="taskRows" class="divide-y divide-slate-100"></tbody>

                    </table>

                </div>


                <!-- ================================================= -->
                <!-- PAGINATION -->
                <!-- ================================================= -->

                <div class="task-pagination px-6 py-4
                        bg-text-active
                        border-t border-slate-200
                        flex items-center
                        justify-center">


                    <!-- Pagination -->
                    <div id="taskPagination" class="flex items-center gap-6">

                        <!-- Previous -->
                        <button class="w-9 h-9
                                    flex items-center justify-center
                                    rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">

                            <span class="material-symbols-outlined text-[20px]">
                                chevron_left
                            </span>

                        </button>


                        <!-- Page 1 -->
                        <button class="w-9 h-9
                                   rounded-lg
                                   bg-button-active
                                   text-text-active
                                   text-sm
                                   font-medium">
                            1
                        </button>


                        <!-- Page 2 -->
                        <button class="w-9 h-9
                                   rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">
                            2
                        </button>


                        <!-- Page 3 -->
                        <button class="w-9 h-9
                                   rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">
                            3
                        </button>


                        <!-- Page 4 -->
                        <button class="w-9 h-9
                                   rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">
                            4
                        </button>


                        <!-- Page 5 -->
                        <button class="w-9 h-9
                                   rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">
                            5
                        </button>


                        <!-- Page 6 -->
                        <button class="w-9 h-9
                                   rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">
                            6
                        </button>


                        <!-- Next -->
                        <button class="w-9 h-9
                                    flex items-center justify-center
                                    rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">

                            <span class="material-symbols-outlined text-[20px]">
                                chevron_right
                            </span>

                        </button>

                    </div>

                </div>

            </div>

        </section>

    </main>
    <script src="../../../JavaScript/api.js"></script>
    <script src="../../../JavaScript/workspace.js"></script>
</body>

</html>
