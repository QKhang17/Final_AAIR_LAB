<!DOCTYPE html>
<html class="light" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base Management</title>
    <link rel="icon" type="image/png" href="/resource/icon/logo_remove_BG.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap">

    <!-- Material Symbols -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap">

    <script src="../../../JavaScript/tailwind.js"></script>
    <link href="../../../Style/basic.css" rel="stylesheet">
    <link href="../../../Style/navbar.css" rel="stylesheet">
    <link href="../../../Style/terminologyManagement.css" rel="stylesheet">
    <link href="../../../Style/jellykeyDesignSystem.css" rel="stylesheet">
</head>
<body class="terminology-management-page bg-surface text-on-surface selection:bg-primary-container selection:text-on-primary-container">
    <div data-aair-navbar-mount></div>

    <script>
        window.AAIRNavbarConfig = {
            brandHref: 'Dashboard.html',
            tabs: [
                { label: 'Dashboard', icon: 'dashboard', href: 'Dashboard.html' },
                { label: 'Terminology Base', icon: 'dictionary', href: 'BaseManagement.html' }
            ]
        };
    </script>

    <!-- Main Dashboard -->
    <main class="min-h-[calc(100vh-98px)] bg-surface p-5">
      <section class="mx-auto max-w-[1550px] pt-8">
    
        <div class="grid grid-cols-12 gap-4">
            <section
                class="col-span-12 overflow-hidden rounded-lg border border-outline-variant bg-white lg:col-span-7"
            >
                <div class="max-h-[590px] overflow-auto">
                    <table class="w-full text-left text-xs">
                        <thead class="sticky top-0 bg-surface-container-low">
                            <tr>
                                <th class="px-4 py-3">Financial Term</th>
                                <th class="px-4 py-3">Abbreviation</th>
                                <th class="px-4 py-3">Category</th>
                                <th class="px-4 py-3">Status</th>
                                <th class="px-4 py-3 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="termRows"></tbody>
                    </table>
                </div>
            </section>
    
            <aside
                class="col-span-12 rounded-lg border border-outline-variant bg-white lg:col-span-5"
            >
                <div
                    class="border-b border-outline-variant bg-surface-container-low px-5 py-4"
                >
                    <h2 class="font-bold">Term Details</h2>
                    <p
                        id="termFormMode"
                        class="mt-1 text-[10px] text-on-surface-variant"
                    >
                        Tạo thuật ngữ mới
                    </p>
                </div>
    
                <form id="termForm" class="grid grid-cols-2 gap-4 p-5">
                    <label class="col-span-2 grid gap-1.5 text-xs font-bold">
                        Financial Term
                        <input
                            id="termName"
                            required
                            maxlength="200"
                            class="rounded-md border-outline-variant text-sm"
                        >
                    </label>
    
                    <label class="grid gap-1.5 text-xs font-bold">
                        Abbreviation
                        <input
                            id="termAbbreviation"
                            maxlength="100"
                            class="rounded-md border-outline-variant text-sm"
                            placeholder="Có thể để trống"
                        >
                    </label>
    
                    <label class="grid gap-1.5 text-xs font-bold">
                        Category
                        <input
                            id="termCategory"
                            maxlength="100"
                            list="termCategories"
                            class="rounded-md border-outline-variant text-sm"
                        >
                        <datalist id="termCategories"></datalist>
                    </label>
    
                    <label class="col-span-2 grid gap-1.5 text-xs font-bold">
                        Definition
                        <textarea
                            id="termDefinition"
                            required
                            rows="3"
                            maxlength="20000"
                            class="rounded-md border-outline-variant text-sm"
                        ></textarea>
                    </label>
    
                    <div class="col-span-2">
                        <label class="mb-1.5 block text-xs font-bold">Synonyms</label>
                        <div id="termSynonyms" class="tag-editor">
                            <input
                                aria-label="Thêm từ đồng nghĩa"
                                placeholder="Nhập rồi Enter hoặc dấu phẩy"
                            >
                        </div>
                    </div>
    
                    <div class="col-span-2">
                        <label class="mb-1.5 block text-xs font-bold">
                            Related Terms
                        </label>
                        <div id="termRelated" class="tag-editor">
                            <input
                                aria-label="Thêm thuật ngữ liên quan"
                                list="relatedOptions"
                                placeholder="Tìm thuật ngữ rồi Enter"
                            >
                            <datalist id="relatedOptions"></datalist>
                        </div>
                    </div>
    
                    <label class="col-span-2 grid gap-1.5 text-xs font-bold">
                        Example Usage
                        <textarea
                            id="termExample"
                            rows="2"
                            maxlength="5000"
                            class="rounded-md border-outline-variant text-sm"
                        ></textarea>
                    </label>
    
                    <label class="grid gap-1.5 text-xs font-bold">
                        Status
                        <select
                            id="termStatusEnhanced"
                            class="rounded-md border-outline-variant text-sm"
                        >
                            <option>ACTIVE</option>
                            <option>INACTIVE</option>
                        </select>
                    </label>
    
                    <div
                        class="col-span-2 flex justify-end gap-2 border-t border-outline-variant pt-4"
                    >
                        <button
                            id="termCancel"
                            type="button"
                            class="rounded-md border border-outline-variant px-4 py-2 text-xs font-bold"
                        >
                            Cancel
                        </button>
    
                        <button
                            class="rounded-md bg-primary px-4 py-2 text-xs font-bold text-white"
                        >
                            Save Term
                        </button>
                    </div>
                </form>
            </aside>
        </div>
    
        <section class="mt-4 overflow-hidden rounded-lg border border-outline-variant bg-white">
            <header
                class="flex flex-wrap items-center gap-3 border-b border-outline-variant bg-surface-container-low px-5 py-4"
            >
                <div class="mr-auto">
                    <h2 class="font-bold">History</h2>
                    <p class="mt-1 text-[10px] text-on-surface-variant">
                        Nhật ký thêm, sửa, xóa · mới nhất trước
                    </p>
                </div>
    
                <select
                    id="historyUser"
                    class="rounded-md border-outline-variant text-xs"
                >
                    <option value="">Tất cả người dùng</option>
                </select>
    
                <select
                    id="historyTerm"
                    class="rounded-md border-outline-variant text-xs"
                >
                    <option value="">Tất cả thuật ngữ</option>
                </select>
            </header>
    
            <div class="max-h-[360px] overflow-auto">
                <table class="w-full text-left text-xs">
                    <thead class="sticky top-0 bg-white">
                        <tr>
                            <th class="px-4 py-3">Thời gian</th>
                            <th class="px-4 py-3">Người thực hiện</th>
                            <th class="px-4 py-3">Hành động</th>
                            <th class="px-4 py-3">Thuật ngữ</th>
                            <th class="px-4 py-3">Thay đổi</th>
                        </tr>
                    </thead>
                    <tbody id="historyRows"></tbody>
                </table>
            </div>
        </section>
    </section>
    </main>

    <!-- javascript -->
    <script></script>
    <script src="../../../JavaScript/api.js"></script>
    <script src="../../../JavaScript/terminologyManagement.js"></script>
    <script src="../../../JavaScript/navbar.js"></script>
    <script src="../../../JavaScript/workspace.js"></script>
</body>
</html>
