<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Tasks</title>
    <link rel="icon" type="image/png" href="/resource/icon/logo_remove_BG.png">

    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap">

    <!-- Material Symbols -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <script src="../../../JavaScript/tailwind.js"></script>

    <link href="../../../Style/basic.css" rel="stylesheet" />
    <link href="../../../Style/manualNavbar.css" rel="stylesheet" />

    <style>
        :root { --gap-section:24px; --row-h:52px; }
        .task-page { min-height:calc(100vh - 120px); padding:24px; }
        .task-page__heading { display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:var(--gap-section); }
        .task-page__heading h1 { display:block!important; visibility:visible!important; margin:0; color:#101828!important; font-size:22px!important; line-height:28px!important; font-weight:700!important; }
        .task-page__heading p { margin:4px 0 0; color:#667085; font-size:13px; }
        .task-toolbar { height:auto; min-height:48px; margin:0 0 20px!important; padding:0!important; flex-wrap:wrap; }
        /* The shared navbar is fixed at 58px. Reserve that space before the
           task filters so the page heading cannot slide underneath them. */
        .manual-labeling-tasks .task-toolbar {
            position:relative!important;
            top:auto!important;
            z-index:10;
            margin-top:0!important;
        }
        .manual-labeling-tasks > main { padding-top:0!important; }
        .task-search { width:min(500px,100%)!important; min-width:260px; height:36px!important; font-size:13px!important; }
        .task-filter-group { display:flex; align-items:center; gap:8px; }
        .task-filter-group label { color:#344054; font-size:13px; font-weight:500; }
        .filter-select { min-width:120px!important; height:36px!important; padding:0 28px 0 10px!important; font-size:13px!important; font-weight:500!important; }
        .task-table-card { border-radius:12px; }
        .task-table { table-layout:fixed; min-width:960px; }
        .task-table th:last-child,.task-table td:last-child { width:112px; text-align:right!important; }
        .task-table th,.task-table td { padding:10px 16px!important; vertical-align:middle; }
        .task-table th:nth-child(1),.task-table td:nth-child(1) { width:27%; }
        .task-table th:nth-child(2),.task-table td:nth-child(2) { width:13%; }
        .task-table th:nth-child(3),.task-table td:nth-child(3) { width:16%; color:#475467; }
        .task-table th:nth-child(4),.task-table td:nth-child(4) { width:12%; color:#475467; }
        .task-table th:nth-child(5),.task-table td:nth-child(5) { width:13%; }
        .task-table th:nth-child(6),.task-table td:nth-child(6) { width:13%; color:#475467; }
        .task-table th:nth-child(7),.task-table td:nth-child(7) { width:10%; }
        .task-table th,.task-table td { height:var(--row-h); padding:10px 16px!important; vertical-align:middle; }
        .task-table th { color:#667085; font-size:12px; font-weight:600; letter-spacing:.04em; text-align:left; text-transform:uppercase; }
        .task-table td { color:#667085; font-size:13px; }
        .task-table td:first-child { color:#101828; }
        .cell-primary { color:#101828!important; font-size:14px!important; font-weight:500!important; text-decoration:none; }
        .cell-primary:hover { color:#175cd3!important; text-decoration:underline; }
        .task-status,.task-type { display:inline-flex; align-items:center; min-height:24px; padding:3px 9px; border-radius:999px; font-size:12px; font-weight:600; }
        .task-status--pending { color:#475467; background:#f2f4f7; }
        .task-status--progress { color:#175cd3; background:#dbeafe; }
        .task-status--submitted { color:#6941c6; background:#f4ebff; }
        .task-status--approved { color:#067647; background:#dff3e9; }
        .task-status--rejected { color:#b42318; background:#fee4e2; }
        .task-type { color:#475467; background:#eef2f6; font-weight:500; }
        .task-conflicts { display:inline-flex; align-items:center; min-height:24px; padding:3px 8px; border-radius:999px; color:#667085; background:#f2f4f7; font-size:12px; font-weight:600; white-space:nowrap; }
        .task-conflicts--active { color:#b54708; background:#fef0c7; }
        .task-due { font-size:13px; }
        .task-due--overdue { color:#b42318!important; font-weight:600; }
        .task-due--soon { color:#b54708!important; font-weight:500; }
        .task-action { display:inline-flex; align-items:center; justify-content:center; width:78px; min-height:32px; padding:0 10px; border:1px solid #cbd5e1; border-radius:7px; color:#344054!important; background:#fff; font-size:13px; font-weight:600; text-decoration:none; }
        .task-action:hover { border-color:#175cd3; color:#175cd3!important; background:#f8fbff; }
        .task-pagination { min-height:52px; }
        .task-pagination[hidden] { display:none; }
        .task-page__heading { align-items:flex-start; gap:16px; }
        .task-page__heading > div:first-child { flex:1; }
        .task-controls { display:flex; align-items:center; justify-content:flex-end; flex-wrap:wrap; gap:10px; }
        .task-chip-group { display:flex; align-items:center; flex-wrap:wrap; gap:6px; }
        .task-chip-label { color:#667085; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
        .task-filter-chip { min-height:30px; padding:4px 10px; border:1px solid #cbd5e1; border-radius:999px; color:#475467; background:#fff; font-size:12px; font-weight:600; cursor:pointer; }
        .task-filter-chip:hover,.task-filter-chip.is-active { border-color:#087fa8; color:#075985; background:#e6f7fb; }
        .task-clear-filters { min-height:30px; padding:4px 10px; border:0; color:#175cd3; background:transparent; font-size:12px; font-weight:700; cursor:pointer; }
        .task-sort-select { height:32px; padding:0 28px 0 10px; border:1px solid #cbd5e1; border-radius:7px; color:#344054; background:#fff; font-size:12px; font-weight:600; }
        .task-table { min-width:760px; }
        .task-table th:nth-child(1),.task-table td:nth-child(1) { width:48%; }
        .task-table th:nth-child(2),.task-table td:nth-child(2) { width:17%; }
        .task-table th:nth-child(3),.task-table td:nth-child(3) { width:14%; }
        .task-table th:nth-child(4),.task-table td:nth-child(4) { width:13%; }
        .task-table th:nth-child(5),.task-table td:nth-child(5) { width:8%; }
        .task-session-header td { padding:16px 20px 12px!important; border-top:1px solid #cbd5e1; border-bottom:0; background:#eaf8fb; }
        .task-session-header:first-child td { border-top:0; }
        .task-session-header__top { display:flex; flex-direction:column; align-items:flex-start; gap:4px; }
        .task-session-header__name { color:#075985; font-size:16px; line-height:22px; font-weight:800; }
        .task-session-header__meta { color:#344054; font-size:13px; line-height:20px; font-weight:600; }
        .task-session-header__meta--overdue { color:#b42318; font-weight:700; }
        .task-session-header__meta--complete { color:#067647; font-weight:700; }
        .task-session-progress { height:8px; margin-top:10px; overflow:hidden; border-radius:999px; background:#c9e0e7; }
        .task-session-progress span { display:block; height:100%; min-width:2px; border-radius:inherit; background:#087fa8; }
        .task-session-file td:first-child { padding-left:36px!important; }
        .task-session-file .cell-primary { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .task-session-file .task-action-cell { padding-right:20px!important; text-align:right; }
        .task-empty-state { padding:36px 16px!important; color:#667085!important; text-align:center; }
        .task-status--pending { color:#9a6700; background:#fff4cc; }
        .task-status--returned { color:#b42318; background:#fee4e2; }
        .task-status--awaiting-review { color:#075985; background:#dff5fa; }
        .task-action--start { border-color:#087fa8; color:#fff!important; background:#087fa8; }
        .task-action--start:hover { border-color:#075985; color:#fff!important; background:#075985; }
        .task-action--continue { border-color:#8ccbdc; color:#075985!important; background:#e6f7fb; }
        .task-action--review,.task-action--view { border-color:#087fa8; color:#fff!important; background:#087fa8; }
        .task-action--review:hover,.task-action--view:hover { border-color:#175cd3; color:#175cd3!important; background:#f8fbff; }
        @media(max-width:1000px) { .task-page__heading { flex-direction:column; } .task-controls { justify-content:flex-start; } }
        @media(max-width:800px) { .task-page { padding:16px; } .task-search { width:100%!important; } .task-toolbar { height:auto; min-height:48px; flex-wrap:wrap; padding:8px 16px!important; } .task-table { min-width:760px; } }
    </style>

    <link href="../../../Style/jellykeyDesignSystem.css" rel="stylesheet">
</head>

<body class="manual-labeling-tasks bg-surface text-on-surface selection:bg-primary-container selection:text-on-primary-container">

    <div data-manual-navbar-mount></div>

    <main class="w-full min-h-[calc(100vh-98px)] bg-surface pt-0">


        <!-- ===================================================== -->
        <!-- PAGE CONTENT -->
        <!-- ===================================================== -->

        <section class="task-page">
            <div class="task-page__heading"><div><h1>My Tasks</h1></div></div>
            <div class="task-toolbar flex items-center gap-2">
                <div class="relative w-[280px]"><span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-[20px]">search</span><input id="taskSearch" type="search" placeholder="Search tasks…" class="task-search w-full h-8 pl-10 pr-4 rounded-lg border border-slate-300 bg-white text-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100"></div>
                <div class="task-filter-group"><label for="taskSessionFilter">Session:</label><select id="taskSessionFilter" class="filter-select bg-surface border border-outline-variant rounded-lg"><option value="">All</option></select></div>
                <div class="task-filter-group"><label for="taskStatusFilter">Status:</label><select id="taskStatusFilter" class="filter-select bg-surface border border-outline-variant rounded-lg"><option value="">All</option><option value="PENDING">Pending</option><option value="IN_PROGRESS">In progress</option><option value="SUBMITTED">Submitted</option><option value="APPROVED">Approved</option><option value="REJECTED">Returned</option></select></div>
                <div class="task-filter-group"><label for="taskSortSelect">Sort:</label><select id="taskSortSelect" class="task-sort-select"><option value="priority">Priority</option><option value="due">Due date</option><option value="status">Status</option></select></div>
            </div>

            <!-- ================================================= -->
            <!-- SESSION TABLE -->
            <!-- ================================================= -->

            <div class="task-table-card bg-white
                        border border-slate-200
                        rounded-xl
                        overflow-hidden">

                <!-- Table -->
                <div class="overflow-x-auto">

                    <table id="taskTable" class="task-table w-full text-sm">

                        <!-- Table Header -->
                        <thead class="bg-text-active
                                      border-b border-slate-200">

                            <tr>

                                <th class="px-6 py-4
                                           text-left
                                           font-semibold
                                           text-slate-600">
                                    Document
                                </th>

                                <th class="px-6 py-4
                                           text-left
                                           font-semibold
                                           text-slate-600">
                                    Status
                                </th>
                                <th>Due</th>
                                <th>Updated
                                </th>

                                <th class="px-6 py-4
                                           text-right
                                           font-semibold
                                           text-slate-600">
                                    Action
                                </th>

                            </tr>

                        </thead>


                        <!-- Table Body -->
                        <tbody id="taskRows" class="divide-y divide-slate-100">
                            <tr hidden aria-hidden="true"><td class="px-6 py-4"></td><td class="px-6 py-4"></td><td class="px-6 py-4"></td><td class="px-6 py-4"></td><td class="px-6 py-4"></td><td class="px-6 py-4"></td><td class="px-6 py-4"></td></tr>
                        </tbody>

                    </table>

                </div>


                <!-- ================================================= -->
                <!-- PAGINATION -->
                <!-- ================================================= -->

                <div class="task-pagination px-6 py-4
                        bg-text-active
                        border-t border-slate-200
                        flex items-center
                        justify-center">


                    <!-- Pagination -->
                    <div id="taskPagination" class="flex items-center gap-6">

                        <!-- Previous -->
                        <button class="w-9 h-9
                                    flex items-center justify-center
                                    rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">

                            <span class="material-symbols-outlined text-[20px]">
                                chevron_left
                            </span>

                        </button>


                        <!-- Page 1 -->
                        <button class="w-9 h-9
                                   rounded-lg
                                   bg-button-active
                                   text-text-active
                                   text-sm
                                   font-medium">
                            1
                        </button>


                        <!-- Page 2 -->
                        <button class="w-9 h-9
                                   rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">
                            2
                        </button>


                        <!-- Page 3 -->
                        <button class="w-9 h-9
                                   rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">
                            3
                        </button>


                        <!-- Page 4 -->
                        <button class="w-9 h-9
                                   rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">
                            4
                        </button>


                        <!-- Page 5 -->
                        <button class="w-9 h-9
                                   rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">
                            5
                        </button>


                        <!-- Page 6 -->
                        <button class="w-9 h-9
                                   rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">
                            6
                        </button>


                        <!-- Next -->
                        <button class="w-9 h-9
                                    flex items-center justify-center
                                    rounded-lg
                                    text-slate-600
                                    hover:bg-slate-200
                                    hover:text-slate-900
                                    transition-colors duration-150">

                            <span class="material-symbols-outlined text-[20px]">
                                chevron_right
                            </span>

                        </button>

                    </div>
                    <span class="text-[13px] text-slate-500" data-task-summary>Showing 0-0 of 0</span>

                </div>

            </div>

        </section>

    </main>

    <script src="../../../JavaScript/api.js"></script>
    <script src="../../../JavaScript/manualNavbar.js"></script>
    <script src="../../../JavaScript/workspace.js"></script>
</body>

</html>
