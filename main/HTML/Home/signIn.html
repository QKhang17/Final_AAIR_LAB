<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | AAIR Lab</title>
    <link rel="icon" href="/resource/icon/brand/aair-logo.svg">
    <link rel="stylesheet" href="../../Style/signIn.css">
    <link href="../../Style/jellykeyDesignSystem.css" rel="stylesheet">
</head>
<body class="login-page">
    <main class="login-main">
        <section class="login-card" aria-labelledby="loginTitle">
            <a class="login-brand" href="home.html" aria-label="AAIR Lab home">
                <img src="/resource/icon/brand/aair-logo.svg" alt="" width="56" height="56">
                <span>AAIR Lab</span>
            </a>
            <h1 id="loginTitle">Welcome back</h1>
            <p class="login-intro">Sign in to your annotation workspace.</p>
            <form id="loginForm">
                <div class="login-field">
                    <label for="username">Username</label>
                    <input id="username" name="username" type="text" placeholder="Enter your username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
                </div>
                <div class="login-field">
                    <label for="password">Password</label>
                    <div class="login-password">
                        <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
                        <button id="passwordToggle" type="button" aria-label="Show password" aria-controls="password" aria-pressed="false" onclick="togglePassword()">Show</button>
                    </div>
                </div>
                <p id="loginError" role="alert"></p>
                <button class="login-submit" type="submit">Sign in <span aria-hidden="true">→</span></button>
            </form>
            <p class="login-help">Need an account or help signing in?<br>Contact your administrator.</p>
        </section>
        <footer class="login-footer"><a href="home.html">← Back to home</a><span>AAIR · Version 1.0</span></footer>
    </main>
    <script src="../../JavaScript/api.js"></script>
    <script src="../../JavaScript/signIn.js"></script>
</body>
</html>
